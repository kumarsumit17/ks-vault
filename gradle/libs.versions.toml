[versions]
# Kotlin is kept in step with ks-utility/kotlin/gradle/libs.versions.toml.
kotlin = "2.4.21"
agp = "9.5.2"
ksp = "2.3.14"

# Android SDK levels.
androidCompileSdk = "37"
androidMinSdk = "26"
androidTargetSdk = "37"

activity = "1.13.0"
appcompat = "1.8.0"
compose = "1.12.1"
composeMaterial3 = "1.4.0"
composeIcons = "1.7.8"
lifecycle = "2.11.0"
room = "2.8.5"
sqlite = "2.7.1"
sqlcipher = "4.20.0"
biometric = "1.1.0"

junit = "4.13.2"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"

[libraries]
# Interface (Apache-2.0).
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "composeMaterial3" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core", version.ref = "composeIcons" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

# Encrypted database: Room (Apache-2.0) on SQLCipher for Android (BSD-3-Clause, Zetetic).
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "sqlite" }
sqlcipher-android = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }

# Fingerprint or face unlock (Apache-2.0).
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }

# First-party: the ks-utility submodule, included with includeBuild in settings.gradle.kts (no version).
ks-utility = { module = "com.ks:utility" }

# Tests only.
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "compose" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
