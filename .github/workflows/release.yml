name: Release

# The release workflow is shared by every KS-Suite Kotlin app and lives in ks-utility
# (https://github.com/kumasumit/ks-utility/blob/main/specs/release-workflow.md).
# This file only names KS Vault's platform: the Android phone app (no Google TV build).
#
#   Tag push android-vX.Y.Z       KS Vault's releases: builds and verifies the signed APK and AAB,
#                                 then publishes the GitHub Release (a platform release, not marked
#                                 latest; suite rule "Platform tags" in KS-Suite specs/versioning-signing.md).
#   Tag push vX.Y.Z               Also accepted (a plain tag releases every platform; here the same one).
#   Manual run (rehearsal)        Builds and checks everything for the version given; never publishes.

on:
  push:
    tags: ["android-v*.*.*", "v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rehearse, X.Y.Z. Builds everything, releases nothing."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: kumasumit/ks-utility/.github/workflows/kotlin-app-release.yml@v0.15.0
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      version: ${{ inputs.version }}
      app-name: ks-vault
      display-name: KS Vault
      android-module: ":mobile:android"   # phone only: no tv-module, no desktop
      play-build-type: "play"             # the AAB is the Google Play build (no GitHub update link)
      node: true                          # the ks-utility language tool runs before each build
    secrets: inherit
