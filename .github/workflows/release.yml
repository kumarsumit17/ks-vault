name: Release

# The release workflow is shared by every KS-Suite Kotlin app and lives in ks-utility
# (https://github.com/kumarsumit17/ks-utility/blob/main/specs/release-workflow.md).
# This file only names KS Vault's platforms.
#
#   Tag push vMAJOR.MINOR.PATCH   Builds and verifies the signed APK and AAB, then publishes the
#                                 GitHub Release (full release, latest).
#   Manual run (rehearsal)        Builds and checks everything for the version given; never publishes.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rehearse, X.Y.Z. Builds everything, releases nothing."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: kumarsumit17/ks-utility/.github/workflows/kotlin-app-release.yml@v0.4.1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      version: ${{ inputs.version }}
      app-name: ks-vault
      display-name: KS Vault
      android-module: ":app"
    secrets: inherit
